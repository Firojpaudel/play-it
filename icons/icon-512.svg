<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Spotify Obsidian & Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="spotifyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean iOS Rounded Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Subtle radial ambient glow in center -->
  <circle cx="256" cy="256" r="160" fill="url(#accentGlow)"/>

  <!-- Icon Artwork: Minimalist Sound Aura Waves + Download Ray -->
  <g filter="url(#emeraldGlow)" transform="translate(0, 0)">
    <!-- Top Arc Wave -->
    <path d="M 136 210 C 206 170, 306 170, 376 210" 
          fill="none" 
          stroke="url(#spotifyGreen)" 
          stroke-width="32" 
          stroke-linecap="round"/>

    <!-- Middle Arc Wave -->
    <path d="M 166 266 C 220 236, 292 236, 346 266" 
          fill="none" 
          stroke="url(#spotifyGreen)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Bottom Arc Wave with Play Accent -->
    <path d="M 196 322 C 234 302, 278 302, 316 322" 
          fill="none" 
          stroke="url(#spotifyGreen)" 
          stroke-width="24" 
          stroke-linecap="round"/>
  </g>

  <!-- Sleek Download Badge in bottom-right corner -->
  <circle cx="376" cy="376" r="48" fill="#1ed760"/>
  <path d="M 376 354 L 376 392 M 360 378 L 376 394 L 392 378" 
        fill="none" 
        stroke="#121212" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
